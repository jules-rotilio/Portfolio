services:
  nginx:
    image: nginx:alpine
    ports:
      - "9080:80"
      - "9443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/bad_user_agents.conf:/etc/nginx/bad_user_agents.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    networks:
      mynet:
        # IP fixe : l'API ne fait confiance à X-Forwarded-For que depuis cette adresse (TRUSTED_PROXY)
        ipv4_address: 172.28.0.2
      mailcowdockerized_mailcow-network:
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: Portfolio.Api/Dockerfile
    ports:
      - "8443:443"
    environment:
      - ASPNETCORE_URLS=https://+:443
      - ASPNETCORE_Kestrel__Certificates__Default__Path=/https/julesrotilio.fr-crt.pem
      - ASPNETCORE_Kestrel__Certificates__Default__KeyPath=/https/julesrotilio.fr-key.pem
      - TRUSTED_PROXY=172.28.0.2
    env_file:
      - Portfolio.Api/.env
    volumes:
      - ./certs:/https:ro
      # Fichiers sources et aperçus des projets, servis par GET /api/projects/{id}
      - ./project-content:/app/project-content:ro
    networks:
      mynet:
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: portfolio-web/Dockerfile
    ports:
      - "4443:4443"
    depends_on:
      - api
    volumes:
      - ./certs:/app/certs:ro
    extra_hosts:
      - "api.julesrotilio.fr:172.28.0.10"
    networks:
      mynet:
        ipv4_address: 172.28.0.11
    restart: unless-stopped

networks:
  mynet:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  mailcowdockerized_mailcow-network:
    external: true
