[package]
name = "voice-changer"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
cpal = "0.18.2"
hound = "3.5.1"
humantime = "2.4.0"
ringbuf = "0.5.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["mp3"] }
sysinfo = "0.39.6"

[target."cfg(unix)".dependencies]
libc = "0.2.190"
