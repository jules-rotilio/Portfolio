<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="600" viewBox="0 0 1260 600" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
<defs><marker id="head3b7dd8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3b7dd8"/></marker></defs>
<rect x="0" y="0" width="1260" height="600" rx="14" fill="#ffffff"/>
<text x="24" y="40" font-size="22" font-weight="700" fill="#1d2330" text-anchor="start">Capture program audio: others hear a copy, you hear the program once</text>
<polyline points="1060,26 1086,26" fill="none" stroke="#3b7dd8" stroke-width="3" stroke-linejoin="round"/>
<text x="1094" y="30" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">the program's sound</text>
<polyline points="1060,46 1086,46" fill="none" stroke="#5b6270" stroke-width="3" stroke-linejoin="round"/>
<text x="1094" y="50" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">Intercom's helpers</text>
<rect x="20" y="60" width="600" height="470" rx="10" fill="#fbfbfc" stroke="#c3c7cf" stroke-width="1.6"/>
<text x="32" y="80" font-size="12" font-weight="700" fill="#5b6270" text-anchor="start">LINUX · PIPEWIRE</text>
<rect x="40" y="100" width="170" height="70" rx="10" fill="#e8f1fd" stroke="#3b7dd8" stroke-width="1.6"/>
<text x="52" y="124" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Spotify</text>
<text x="52" y="146" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">its sound stream</text>
<rect x="430" y="100" width="170" height="70" rx="10" fill="#f0f1f3" stroke="#8a8f98" stroke-width="1.6"/>
<text x="442" y="124" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Your headset</text>
<text x="442" y="146" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">as always</text>
<polyline points="210,125 430,125" fill="none" stroke="#3b7dd8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head3b7dd8)"/>
<text x="270" y="116" font-size="12" font-weight="600" fill="#3b7dd8" text-anchor="start">its usual link</text>
<rect x="250" y="210" width="200" height="85" rx="10" fill="#fff4e0" stroke="#d98e0b" stroke-width="1.6"/>
<text x="262" y="234" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Intercom Apps</text>
<text x="262" y="256" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">a speaker that plays</text>
<text x="262" y="275" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">nowhere (null sink)</text>
<polyline points="130,170 130,252 250,252" fill="none" stroke="#3b7dd8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head3b7dd8)"/>
<text x="138" y="205" font-size="12" font-weight="600" fill="#3b7dd8" text-anchor="start">+ links by pw-link</text>
<rect x="250" y="330" width="200" height="70" rx="10" fill="#fff4e0" stroke="#d98e0b" stroke-width="1.6"/>
<text x="262" y="354" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Intercom records</text>
<text x="262" y="376" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">its monitor (cpal)</text>
<polyline points="350,295 350,330" fill="none" stroke="#3b7dd8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head3b7dd8)"/>
<rect x="250" y="435" width="200" height="75" rx="10" fill="#e6f6ef" stroke="#2e9d6a" stroke-width="1.6"/>
<text x="262" y="459" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Engine → Intercom Mic</text>
<text x="262" y="481" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">at “Volume for others”</text>
<polyline points="350,400 350,435" fill="none" stroke="#3b7dd8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head3b7dd8)"/>
<text x="358" y="422" font-size="12" font-weight="600" fill="#3b7dd8" text-anchor="start">ProgramTap</text>
<rect x="470" y="210" width="135" height="190" rx="10" fill="#ffffff" stroke="#c3c7cf" stroke-width="1.6"/>
<text x="482" y="234" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Helpers</text>
<text x="482" y="256" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">pw-dump finds</text>
<text x="482" y="275" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">the ports;</text>
<text x="482" y="294" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">pactl subscribe</text>
<text x="482" y="313" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">says when a new</text>
<text x="482" y="332" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">stream starts (a</text>
<text x="482" y="351" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">new video): links</text>
<text x="482" y="370" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">checked again</text>
<text x="40" y="470" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">Picking “None” removes</text>
<text x="40" y="488" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">Intercom Apps, links and all.</text>
<rect x="640" y="60" width="600" height="470" rx="10" fill="#fbfbfc" stroke="#c3c7cf" stroke-width="1.6"/>
<text x="652" y="80" font-size="12" font-weight="700" fill="#5b6270" text-anchor="start">WINDOWS 10 (2004) OR LATER</text>
<rect x="660" y="100" width="190" height="85" rx="10" fill="#e8f1fd" stroke="#3b7dd8" stroke-width="1.6"/>
<text x="672" y="124" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Spotify.exe</text>
<text x="672" y="146" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">and its child processes,</text>
<text x="672" y="165" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">which play the sound</text>
<rect x="1050" y="100" width="170" height="70" rx="10" fill="#f0f1f3" stroke="#8a8f98" stroke-width="1.6"/>
<text x="1062" y="124" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Your headset</text>
<text x="1062" y="146" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">as always</text>
<polyline points="850,125 1050,125" fill="none" stroke="#3b7dd8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head3b7dd8)"/>
<text x="900" y="116" font-size="12" font-weight="600" fill="#3b7dd8" text-anchor="start">plays as usual</text>
<rect x="870" y="210" width="230" height="100" rx="10" fill="#fff4e0" stroke="#d98e0b" stroke-width="1.6"/>
<text x="882" y="234" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Process loopback</text>
<text x="882" y="256" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">the system records one</text>
<text x="882" y="275" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">program's sound and its</text>
<text x="882" y="294" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">children, untouched</text>
<polyline points="755,185 755,260 870,260" fill="none" stroke="#3b7dd8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head3b7dd8)"/>
<rect x="870" y="340" width="230" height="70" rx="10" fill="#fff4e0" stroke="#d98e0b" stroke-width="1.6"/>
<text x="882" y="364" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Capture thread</text>
<text x="882" y="386" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">float or 16-bit, to mono</text>
<polyline points="985,310 985,340" fill="none" stroke="#3b7dd8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head3b7dd8)"/>
<rect x="870" y="435" width="230" height="75" rx="10" fill="#e6f6ef" stroke="#2e9d6a" stroke-width="1.6"/>
<text x="882" y="459" font-size="15" font-weight="700" fill="#1d2330" text-anchor="start">Engine → CABLE Input</text>
<text x="882" y="481" font-size="13" font-weight="400" fill="#5b6270" text-anchor="start">→ CABLE Output (Discord)</text>
<polyline points="985,410 985,435" fill="none" stroke="#3b7dd8" stroke-width="2.2" stroke-linejoin="round" marker-end="url(#head3b7dd8)"/>
<text x="993" y="427" font-size="12" font-weight="600" fill="#3b7dd8" text-anchor="start">ProgramTap</text>
<text x="660" y="330" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">The audio sessions (like the</text>
<text x="660" y="348" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">volume mixer) list who plays.</text>
<text x="660" y="366" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">Intercom records the topmost</text>
<text x="660" y="384" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">process with the same .exe,</text>
<text x="660" y="402" font-size="12" font-weight="400" fill="#5b6270" text-anchor="start">which includes the children.</text>
<text x="24" y="565" font-size="13" font-weight="400" fill="#1d2330" text-anchor="start">Turning the voice changer ON sets the capture back to “None”. Intercom itself and Discord are never offered: your friends would hear themselves.</text>
</svg>
