events {}

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api_upstream { server api:443; }
  upstream web_upstream { server web:4443; }
  upstream mail_upstream { server nginx-mailcow:443; }

  # ---------- Réglages communs ----------

  # Ne pas annoncer la version de nginx dans les réponses et pages d'erreur
  server_tokens off;

  # TLS : profil "intermediate" de Mozilla (TLS 1.2 et 1.3 uniquement, chiffrements modernes)
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  # Contre les connexions volontairement lentes (slowloris) : délai max entre deux envois du client
  client_header_timeout 10s;
  client_body_timeout 15s;
  keepalive_timeout 30s;

  # Limites par adresse IP pour le portfolio (le serveur mail n'est pas concerné)
  limit_req_zone $binary_remote_addr zone=portfolio_req:10m rate=10r/s;
  limit_conn_zone $binary_remote_addr zone=portfolio_conn:10m;
  limit_req_status 429;
  limit_conn_status 429;

  # Paramètres de proxy communs (repris par chaque location qui ne les redéfinit pas)
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;
  proxy_connect_timeout 10s;
  proxy_send_timeout 60s;
  proxy_read_timeout 60s;
  proxy_ssl_verify off;

  # ---------- Rejet de tout ce qui n'est pas déclaré ----------

  # Toute requête dont le nom d'hôte n'est pas déclaré ci-dessous (IP directe, ancien DDNS, scanners...)
  # est rejetée : connexion fermée sans réponse en HTTP, handshake TLS refusé en HTTPS.
  server {
    listen 80 default_server;
    server_name _;
    return 444;
  }

  server {
    listen 443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
  }

  server {
    listen 80;
    server_name api.julesrotilio.fr julesrotilio.fr mail.rotilio.fr autoconfig.rotilio.fr autodiscover.rotilio.fr;
    return 301 https://$host$request_uri;
  }

  # ---------- API ----------

  server {
    listen 443 ssl;
    server_name api.julesrotilio.fr;

    ssl_certificate     /etc/nginx/certs/julesrotilio.fr-crt.pem;
    ssl_certificate_key /etc/nginx/certs/julesrotilio.fr-key.pem;
    ssl_trusted_certificate /etc/nginx/certs/julesrotilio.fr-chain.pem;

    limit_req zone=portfolio_req burst=20 nodelay;
    limit_conn portfolio_conn 10;

    # Le plus gros message possible (5000 caractères) tient largement dans 64 ko
    client_max_body_size 64k;

    # L'API n'utilise que GET (projets), POST (contact) et OPTIONS (pré-vérification CORS)
    if ($request_method !~ ^(GET|HEAD|POST|OPTIONS)$) {
      return 405;
    }

    # L'API ne renvoie que du JSON : aucune ressource à charger, ne peut pas être affichée dans un cadre
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;
    add_header Referrer-Policy "no-referrer" always;

    location / {
      proxy_pass https://api_upstream;
    }
  }

  # ---------- Site portfolio ----------

  server {
    listen 443 ssl;
    server_name julesrotilio.fr;

    ssl_certificate     /etc/nginx/certs/julesrotilio.fr-crt.pem;
    ssl_certificate_key /etc/nginx/certs/julesrotilio.fr-key.pem;
    ssl_trusted_certificate /etc/nginx/certs/julesrotilio.fr-chain.pem;

    # Un chargement de page = la page + une quinzaine de fichiers : la rafale de 40 laisse de la marge
    limit_req zone=portfolio_req burst=40 nodelay;
    limit_conn portfolio_conn 20;

    # Le site ne reçoit jamais de données (le formulaire de contact est envoyé à l'API)
    client_max_body_size 16k;
    if ($request_method !~ ^(GET|HEAD)$) {
      return 405;
    }

    # Ne pas annoncer qu'Express tourne derrière
    proxy_hide_header X-Powered-By;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self'" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    # Fichiers cachés (.env, .git...) : le site n'en sert aucun, on répond directement aux scanners
    location ~ /\.(?!well-known/) {
      return 404;
    }

    location / {
      proxy_pass https://web_upstream;
    }
  }

  # ---------- Serveur mail (mailcow gère lui-même sa sécurité, on aligne seulement les limites) ----------

  server {
    listen 443 ssl;
    server_name mail.rotilio.fr autoconfig.rotilio.fr autodiscover.rotilio.fr;

    ssl_certificate     /etc/nginx/certs/rotilio.fr-crt.pem;
    ssl_certificate_key /etc/nginx/certs/rotilio.fr-key.pem;
    ssl_trusted_certificate /etc/nginx/certs/rotilio.fr-chain.pem;

    # Mêmes valeurs que le nginx de mailcow : pièces jointes sans limite de taille dans SOGo,
    # et connexions longues pour la synchronisation push des téléphones (ActiveSync)
    client_max_body_size 0;
    client_body_timeout 60s;

    location / {
      proxy_pass https://mail_upstream;
      proxy_send_timeout 3600s;
      proxy_read_timeout 3600s;
    }
  }

  server {
    listen 80;
    server_name rotilio.fr;
    return 301 https://mail.rotilio.fr$request_uri;
  }

  server {
    listen 443 ssl;
    server_name rotilio.fr;

    ssl_certificate     /etc/nginx/certs/rotilio.fr-crt.pem;
    ssl_certificate_key /etc/nginx/certs/rotilio.fr-key.pem;
    ssl_trusted_certificate /etc/nginx/certs/rotilio.fr-chain.pem;

    return 301 https://mail.rotilio.fr$request_uri;
  }
}
