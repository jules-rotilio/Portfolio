<div class="container">
	<div class="row g-4 g-lg-5">
		<div class="col-lg-7">
			<h2 class="section-title"><i class="bi bi-envelope-at-fill me-2"></i>Contactez-moi</h2>
			<form (ngSubmit)="send()" #contactForm="ngForm" class="card p-3 p-sm-4 shadow-sm mb-4">
				<div class="mb-3">
					<label for="from" class="form-label">Votre email</label>
					<div class="input-group">
						<span class="input-group-text"><i class="bi bi-person-fill"></i></span>
						<input id="from" name="from" type="email" class="form-control" [(ngModel)]="form.from" required email
							maxlength="254"
							placeholder="Votre adresse email">
					</div>
				</div>
				<div class="mb-3">
					<label for="subject" class="form-label">Sujet</label>
					<div class="input-group">
						<span class="input-group-text"><i class="bi bi-chat-left-text-fill"></i></span>
						<input id="subject" name="subject" type="text" class="form-control" [(ngModel)]="form.subject"
							required maxlength="150" placeholder="Sujet du message">
					</div>
				</div>
				<div class="mb-3">
					<label for="body" class="form-label">Message</label>
					<textarea id="body" name="body" class="form-control" rows="5" [(ngModel)]="form.body" required
						maxlength="5000"
						placeholder="Votre message"></textarea>
				</div>
				<button type="submit" class="btn btn-primary w-100" [disabled]="contactForm.invalid || sending">
					<i class="bi bi-send-fill me-2"></i>{{ sending ? 'Envoi en cours…' : 'Envoyer' }}
				</button>
			</form>

			<div *ngIf="success" class="alert alert-success d-flex align-items-center" role="alert">
				<i class="bi bi-check-circle-fill me-2"></i>Message envoyé !
			</div>
			<div *ngIf="error" class="alert alert-danger d-flex align-items-center" role="alert">
				<i class="bi bi-exclamation-triangle-fill me-2"></i>{{ error }}
			</div>
		</div>

		<div class="col-lg-5">
			<h2 class="section-title"><i class="bi bi-link-45deg me-2"></i>Mes liens professionnels</h2>
			<ul class="list-group list-group-flush">
				<li class="list-group-item">
					<a href="https://www.linkedin.com/in/jules-rotilio/" target="_blank" rel="noopener" class="text-decoration-none">
						<i class="bi bi-linkedin me-2 text-primary"></i>Jules ROTILIO via LinkedIn
					</a>
				</li>
				<li class="list-group-item">
					<a href="mailto:jules@rotilio.fr" class="text-decoration-none">
						<i class="bi bi-envelope-fill me-2 text-danger"></i>Jules ROTILIO via Email
					</a>
				</li>
			</ul>
			<p class="mt-3">
				<i class="bi bi-briefcase-fill me-2"></i>Également présent sur France Travail, HelloWork et Indeed.
			</p>
		</div>
	</div>
</div>
