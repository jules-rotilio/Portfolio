server {
    listen 443 ssl;
    server_name julesrotilio.fr;

    ssl_certificate /etc/ssl/certs/julesrotilio.fr.crt;
    ssl_certificate_key /etc/ssl/private/julesrotilio.fr.key;
    ssl_trusted_certificate /etc/ssl/certs/julesrotilio.fr.chain.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
