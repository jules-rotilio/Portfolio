<!doctype html>
<html lang="fr-FR">
<head>
  <meta charset="utf-8">
  <title>Portfolio Jules ROTILIO</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>
  <!-- Applique le thème avant le premier affichage (évite le flash blanc). Même logique que FooterComponent. -->
  <script>
    (function () {
      var dark = false;
      try {
        var saved = localStorage.getItem('theme');
        dark = saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches);
      } catch (e) {}
      document.body.classList.add(dark ? 'dark-theme' : 'white-theme');
    })();
  </script>
  <app-root></app-root>
</body>
</html>
