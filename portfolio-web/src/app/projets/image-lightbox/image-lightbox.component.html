<div class="lightbox" role="dialog" aria-modal="true" [attr.aria-label]="images[index].alt" (click)="closed.emit()">
	<button #closeButton type="button" class="lightbox-close" aria-label="Fermer l'image" (click)="closed.emit()">
		<i class="bi bi-x-lg" aria-hidden="true"></i>
	</button>
	<figure (click)="$event.stopPropagation()">
		<img [src]="images[index].url" [alt]="images[index].alt" />
		<figcaption>
			@if (images[index].caption) {
				{{ images[index].caption }} ·
			}
			{{ index + 1 }} / {{ images.length }}
		</figcaption>
	</figure>
	@if (images.length > 1) {
		<button type="button" class="nav prev" aria-label="Image précédente" (click)="$event.stopPropagation(); indexChange.emit(index - 1)">
			<i class="bi bi-chevron-left" aria-hidden="true"></i>
		</button>
		<button type="button" class="nav next" aria-label="Image suivante" (click)="$event.stopPropagation(); indexChange.emit(index + 1)">
			<i class="bi bi-chevron-right" aria-hidden="true"></i>
		</button>
	}
</div>
